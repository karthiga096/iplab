<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:url("https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1600") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:rgba(255,255,255,0.9);
    padding:30px;
    width:300px;
    border-radius:10px;
    text-align:center;
}

h2{
    margin-bottom:20px;
    color:#0077cc;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    background:#0077cc;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#005fa3;
}

p{
    margin-top:15px;
}

a{
    color:#0077cc;
    text-decoration:none;
}
</style>

<script>
function loginSuccess(){
    alert("Login Successfully!");
    return false;
}
</script>

</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <form onsubmit="return loginSuccess()">
        <input type="email" placeholder="Enter Email" required>
        <input type="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="ex4ip.html">Register</a></p>
</div>

</body>
</html>
