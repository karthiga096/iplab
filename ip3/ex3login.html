<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping System</title>
</head>
<!-- Applied background image, padding, and fall-back pink color using inline CSS -->
<body style="background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNXNRfRifrAY26IPKock130DLts7NgfGlgAL1PrTRJxQ&s=10') no-repeat center center fixed; background-size: cover; font-family: 'Arial', sans-serif; background-color: pink; margin: 0; padding: 40px 20px;">

    <!-- Centralised login card with specified padding selectors -->
    <div style="background: rgba(255, 255, 255, 0.95); max-width: 400px; margin: 60px auto; padding: 40px 30px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); text-align: center;">
        
        <h2 style="color: red; margin-bottom: 25px; font-size: 1.8em;">login here!!!!</h2>
        
        <form>
            <!-- Email Input Field -->
            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold; color: #333; display: block; margin-bottom: 5px;">Email:</label>
                <input type="text" style="width: 85%; padding: 12px; border: 1px solid #ffccd8; border-radius: 8px; outline: none; font-size: 1em;">
            </div>

            <!-- Password Input Field (Hidden using type="password") -->
            <div style="margin-bottom: 25px;">
                <label style="font-weight: bold; color: #333; display: block; margin-bottom: 5px;">Password:</label>
                <input type="password" style="width: 85%; padding: 12px; border: 1px solid #ffccd8; border-radius: 8px; outline: none; font-size: 1em;">
            </div>

            <!-- Submit Button with inline padding and layout adjustments -->
            <div style="margin-bottom: 20px;">
                <input type="submit" value="Submit" style="background-color: #ff3366; color: white; border: none; padding: 12px 35px; font-size: 1.05em; font-weight: bold; border-radius: 8px; cursor: pointer; width: 90%;">
            </div>
        </form>

        <!-- Forgot Password Link wrapper -->
        <p style="color: #666; font-size: 0.95em; margin-bottom: 20px; cursor: pointer; text-decoration: underline;">forgot password</p>
        
        <!-- Redirect to Home Page Link -->
        <a href="ex2home.html" style="color: #ff3366; text-decoration: none; font-weight: bold; font-size: 1.05em;">go to Home</a>
    </div>

</body>
</html>
