<!DOCTYPE html> 
<html> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1.0"> 
<title>User Registration</title> 
<style> 
*{box-sizing:border-box;margin:0;padding:0} 
body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);min
height:100vh;display:flex;justify-content:center;align-items:center;padding:30px} 
.card{background:white;width:100%;max-width:520px;padding:35px 40px;border
radius:18px;box-shadow:0 15px 40px rgba(0,0,0,.25)} 
h1{text-align:center;color:#333;margin-bottom:8px} 
.subtitle{text-align:center;color:#777;margin-bottom:28px} 
.form-group{margin-bottom:18px} 
label{display:block;font-weight:bold;color:#333;margin-bottom:7px} 
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font
size:15px;outline:none} 
textarea{resize:vertical;min-height:80px} 
input:focus,select:focus,textarea:focus{border-color:#667eea;box-shadow:0 0 5px 
rgba(102,126,234,.4)} 
.hint{font-size:11px;color:#888;margin-top:4px} 
button{width:100%;padding:13px;border:0;border-radius:8px;background:linear
gradient(135deg,#667eea,#764ba2);color:white;font-size:16px;font
weight:bold;cursor:pointer;margin-top:5px} 
button:hover{opacity:.9} 
.footer{text-align:center;color:#888;font-size:12px;margin-top:20px} 
@media(max-width:600px){.card{padding:25px 20px}} 
</style> 
</head> 
<body> 
<div class="card"> 
<h1>Create Account</h1> 
<p class="subtitle">Enter your details to register</p> 
<form action="display.jsp" method="post" onsubmit="return validateForm()"> 
<div class="form-group"><label>Username</label><input type="text" id="username" 
name="username" placeholder="Enter username" minlength="4" maxlength="20" required><p 
class="hint">4–20 characters, letters, numbers or underscore</p></div> 
<div class="form-group"><label>Password</label><input type="password" id="password" 
name="password" placeholder="Enter password" minlength="8" required><p 
class="hint">Minimum 8 characters</p></div> 
<div class="form-group"><label>Full Name</label><input type="text" id="name" name="name" 
placeholder="Enter your full name" required></div> 
<div class="form-group"><label>Credit Card Number</label><input type="text" 
id="creditcardno" name="creditcardno" placeholder="Enter 16-digit card number" 
maxlength="16" required><p class="hint">Enter exactly 16 digits</p></div> 
<div class="form-group"><label>Email Address</label><input type="email" id="email" 
name="email" placeholder="example@email.com" required></div> 
<div class="form-group"><label>Phone Number</label><input type="tel" id="phoneno" 
name="phoneno" placeholder="Enter 10-digit phone number" maxlength="10" required><p 
class="hint">Enter exactly 10 digits</p></div> 
<div class="form-group"><label>Date of Birth</label><input type="date" id="dob" name="dob" 
required></div> 
<div class="form-group"><label>Gender</label><select id="gender" name="gender" 
required><option value="">Select 
Gender</option><option>Male</option><option>Female</option><option>Other</option></se
lect></div> 
<div class="form-group"><label>Address</label><textarea id="address" name="address" 
placeholder="Enter your address" required></textarea></div> 
<div class="form-group"><label>City</label><input type="text" id="city" name="city" 
placeholder="Enter city" required></div> 
<div class="form-group"><label>State</label><input type="text" id="state" name="state" 
placeholder="Enter state" required></div> 
<div class="form-group"><label>Pincode</label><input type="text" id="pincode" 
name="pincode" placeholder="Enter 6-digit pincode" maxlength="6" required></div> 
<button type="submit">Register</button> 
</form> 
<p class="footer">All fields are required</p> 
</div> 
<script> 
function validateForm(){ 
var 
u=document.getElementById("username").value.trim(),p=document.getElementById("passwor
d").value,n=document.getElementById("name").value.trim(),c=document.getElementById("cred
itcardno").value.trim(),e=document.getElementById("email").value.trim(),ph=document.getEle
mentById("phoneno").value.trim(),ci=document.getElementById("city").value.trim(),s=documen
t.getElementById("state").value.trim(),pin=document.getElementById("pincode").value.trim(); 
if(!/^[A-Za-z0-9_]{4,20}$/.test(u)){alert("Username must be 4-20 characters.");return false} 
if(p.length<8){alert("Password must contain at least 8 characters.");return false} 
if(!/^[A-Za-z ]+$/.test(n)){alert("Name should contain only letters and spaces.");return false} 
if(!/^[0-9]{16}$/.test(c)){alert("Credit card number must contain exactly 16 digits.");return false} 
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){alert("Please enter a valid email address.");return 
false} 
if(!/^[0-9]{10}$/.test(ph)){alert("Phone number must contain exactly 10 digits.");return false} 
if(!/^[A-Za-z ]+$/.test(ci)){alert("City should contain only letters and spaces.");return false} 
if(!/^[A-Za-z ]+$/.test(s)){alert("State should contain only letters and spaces.");return false} 
if(!/^[0-9]{6}$/.test(pin)){alert("Pincode must contain exactly 6 digits.");return false} 
return true; 
} 
</script> 
</body> 
</html>
